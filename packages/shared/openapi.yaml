openapi: 3.1.0
info:
  title: Delysa Florist API
  version: 0.1.0
  description: Kontrak tunggal FE↔BE (Fase 0). Sumber kebenaran — jangan edit types.gen.ts manual.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel lokal (VPS/dev BE)
  - url: https://api.delysaflorist.example/api/v1
    description: Produksi (placeholder)
paths:
  /health:
    get:
      operationId: health
      summary: Healthcheck API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /products:
    get:
      operationId: listProducts
      summary: List katalog (Fase 2 hoạch định — stub Fase 0)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
  /orders:
    post:
      operationId: createOrder
      summary: Create new order (checkout submit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "409":
          description: Stock insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/payment-proof:
    post:
      operationId: uploadPaymentProof
      summary: Upload payment proof for order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaymentProofUpload"
      responses:
        "200":
          description: Proof uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
components:
  schemas:
    Product:
      type: object
      required: [id, name, slug, price, stock]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        price: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string }
        isActive: { type: boolean }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string, example: STOCK_INSUFFICIENT }
    OrderCreateRequest:
      type: object
      required: [recipientName, recipientPhone, shippingAddress, idempotencyKey]
      properties:
        recipientName: { type: string, minLength: 2, maxLength: 100 }
        recipientPhone: { type: string, minLength: 9, maxLength: 20 }
        shippingAddress: { type: string, minLength: 10, maxLength: 500 }
        customNote: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, format: uuid }
    PaymentProofUpload:
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          format: binary
    OrderResponse:
      type: object
      required: [id, code, status, total]
      properties:
        id: { type: integer }
        code: { type: string, example: "DLF-20261019-ABCD" }
        status:
          {
            type: string,
            enum:
              [
                pending_payment,
                pending_verification,
                paid,
                processing,
                shipped,
                delivered,
                cancelled,
                rejected,
              ],
          }
        total: { type: integer }

openapi: 3.1.0
info:
  title: Delysa Florist API
  version: 0.1.0
  description: Kontrak tunggal FE↔BE (Fase 0). Sumber kebenaran — jangan edit types.gen.ts manual.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel lokal (VPS/dev BE)
  - url: https://api.delysaflorist.example/api/v1
    description: Produksi (placeholder)
paths:
  /health:
    get:
      operationId: health
      summary: Healthcheck API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /auth/register:
    post:
      operationId: register
      summary: Register a customer account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      security:
        - sanctumCookie: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: me
      summary: Get the current authenticated user
      security:
        - sanctumCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthenticated or session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products:
    get:
      operationId: listProducts
      summary: List katalog (Fase 2 hoạch định — stub Fase 0)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
  /orders:
    post:
      operationId: createOrder
      summary: Create new order (checkout submit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "409":
          description: Stock insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/payment-proof:
    post:
      operationId: uploadPaymentProof
      summary: Upload payment proof for order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaymentProofUpload"
      responses:
        "200":
          description: Proof uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: delysa_session
  schemas:
    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, store_owner, admin] }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Product:
      type: object
      required: [id, name, slug, price, stock]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        price: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: string }
        isActive: { type: boolean }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string, example: STOCK_INSUFFICIENT }
    OrderCreateRequest:
      type: object
      required: [recipientName, recipientPhone, shippingAddress, idempotencyKey]
      properties:
        recipientName: { type: string, minLength: 2, maxLength: 100 }
        recipientPhone: { type: string, minLength: 9, maxLength: 20 }
        shippingAddress: { type: string, minLength: 10, maxLength: 500 }
        customNote: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, format: uuid }
    PaymentProofUpload:
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          format: binary
    OrderResponse:
      type: object
      required: [id, code, status, total]
      properties:
        id: { type: integer }
        code: { type: string, example: "DLF-20261019-ABCD" }
        status:
          {
            type: string,
            enum:
              [
                pending_payment,
                pending_verification,
                paid,
                processing,
                shipped,
                delivered,
                cancelled,
                rejected,
              ],
          }
        total: { type: integer }
